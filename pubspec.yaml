name: offline_transfer
description: "Offline peer-to-peer file transfer. No internet. No cloud. No server."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Nearby Connections (Wi-Fi Direct / Bluetooth)
  nearby_connections: ^4.0.0

  # QR Code generation & scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Hive for local persistence (resume state, history)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking
  file_picker: ^8.1.7

  # Permissions
  permission_handler: ^11.3.1

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # Device info
  device_info_plus: ^10.1.2

  # UUID generation
  uuid: ^4.5.1

  # Crypto (SHA-256 hash)
  crypto: ^3.0.6

  # Encrypt (AES-256-GCM)
  encrypt: ^5.0.3

  # Open files
  open_file: ^3.5.10

  # Intl for formatting
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
